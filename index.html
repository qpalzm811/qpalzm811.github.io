.landport-table--vehicles{grid-column:17/span 4;grid-row:2/-1;align-self:start;height:clamp(260px,34vh,380px);min-height:0}
.landport-share,.landport-flow,.landport-trend,.landport-table{box-sizing:border-box;min-width:0;min-height:0;padding:8px 10px;overflow:hidden}
.landport-share h4,.landport-flow h4,.landport-trend h4,.landport-table h4{margin:0 0 7px;font-size:13px}
.landport-share .pie{width:min(100%,300px);height:auto;max-height:150px}
.landport-flow .hb{margin:3px 0;font-size:12px;gap:8px}
.landport-flow .hb>b{font-size:12px}
.landport-trend .trend{height:auto!important;min-height:0;flex:1 1 0}
.landport-trend .tlab{height:18px;flex:0 0 18px;margin-top:2px}
.landport-table .tw{flex:1;min-height:0;overflow:auto}
.landport-table table{width:100%;table-layout:fixed;font-size:12px;line-height:1.2}
.landport-table th,.landport-table td{padding:3px 6px}
.landport-table--frequent table{font-size:11px}
.landport-table--frequent th,.landport-table--frequent td{padding:3px 3px;overflow:hidden;text-overflow:ellipsis}
.landport-table--frequent th:nth-child(1),.landport-table--frequent td:nth-child(1){width:13%}
.landport-table--frequent th:nth-child(2),.landport-table--frequent td:nth-child(2){width:33%}
.landport-table--frequent th:nth-child(3),.landport-table--frequent td:nth-child(3){width:33%}
.landport-table--frequent th:nth-child(4),.landport-table--frequent td:nth-child(4){width:21%}
.foot{margin:0;padding:0 4px;font-size:11px;color:var(--fg3)}
.md{border-color:rgba(92,225,255,.4);border-radius:7px}.md-h{border-radius:6px 6px 0 0}.toast{border-radius:6px}
.btn:focus-visible,.btn-h:focus-visible,.seg button:focus-visible,.pick:focus-visible,.cal button:focus-visible,.sw a:focus-visible{outline:2px solid #C5E6DD;outline-offset:2px}
@media(max-width:1440px){
  .side-column,.center-zone{grid-column:1;grid-row:auto;height:auto;align-self:stretch}
  .static-zone{height:auto}
  body{height:auto;min-height:100%;overflow:auto;display:block}.page{width:100%;height:auto;min-height:100vh;grid-template-rows:62px auto auto;overflow:visible}
  .dashboard{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:auto;align-content:start}
  .side-column,.center-zone{grid-column:1;grid-row:auto}.platform.panel,.platform{height:600px}.side-column .platform{height:auto;min-height:0}.center-zone{height:auto}.static-zone{height:auto}
  .landport-heading,.landport-metrics,.landport-share,.landport-flow,.landport-trend,.landport-table{grid-column:1;grid-row:auto}
  .landport-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .landport-share,.landport-flow{min-height:180px}
  .landport-trend{min-height:160px}
  .landport-table--frequent,.landport-table--vehicles{min-height:200px}
  .landport-share .pie{width:100%;height:auto;max-height:120px}
  .static-zone{min-height:740px}.static-zone .sgrid{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(3,minmax(220px,auto))}.static-zone .sgrid .j{grid-column:span 12}.static-zone .sgrid .s{grid-column:span 6}
  #static>.card:nth-child(n){grid-row:auto;grid-column:span 6}#static>.card:nth-child(1){grid-column:1/-1}
  .foot{padding:4px}
}
@media(max-height:980px) and (min-width:1441px){
  body{height:auto;min-height:100%;overflow:auto;display:block}
  .page{height:auto;min-height:100dvh;grid-template-rows:62px auto auto;overflow:visible}
  .dashboard{grid-template-rows:auto;grid-auto-rows:auto;align-content:start}
  .platform.panel,.platform{height:auto;min-height:340px}
  .center-zone,.static-zone{height:auto;min-height:0}
  .landport-heading,.landport-metrics,.landport-share,.landport-flow,.landport-trend{grid-row:auto}
  .landport-share,.landport-flow{min-height:220px}
  .landport-trend{min-height:180px}
}
@media(max-width:760px){
  .page{padding:8px;gap:8px}.page>.top{padding:10px;align-items:flex-start}.brand h1{font-size:17px}.brand small{display:none}.hright{width:100%;justify-content:flex-start}.dashboard{gap:8px}.center-zone{gap:8px}
  .zone-heading{align-items:flex-start}.zone-heading .ctrl{width:100%}.static-zone{padding:9px;min-height:740px}.static-zone .sgrid{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:minmax(220px,auto)}.static-zone .sgrid .j,.static-zone .sgrid .s{grid-column:1/-1}#static>.card:nth-child(n){grid-row:auto;grid-column:1/-1}
  .platform.panel,.platform{height:540px}.side-column .platform{height:auto;min-height:0}.landport-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .landport-share,.landport-flow,.landport-trend,.landport-table{grid-column:1}
  #p-lp .pb{grid-template-columns:minmax(0,1fr)}
  #p-lp .pb>.cards3,#p-lp .pb>.row2,#p-lp .pb>.sub:nth-child(3){grid-column:1}
  #p-lp .pb>.row2{grid-template-columns:minmax(0,1fr)}
  .foot{font-size:10px}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><div class="logo">关</div><div><h1>某地海关业务运行监控中心</h1><small>业务运行全局监控 · 1+3+N</small></div></div>
    <div class="hright" id="hright"></div>
  </header>

  <main class="dashboard">
    <div class="side-column side-column--left">
      <section class="panel platform" id="p-sh"></section>
      <section class="panel landport-side" id="lp-frequent"></section>
    </div>

    <div class="center-zone">
      <section class="static-zone">
        <div class="zone-heading">
          <div><h2 id="ptitle">静态业务数据</h2><div class="note" id="pmeta"></div></div>
          <div class="ctrl"><div class="seg" id="seg"><button data-t="m">月度</button><button data-t="q">季度</button></div><select class="pick" id="pick"></select></div>
        </div>
        <div class="sgrid" id="static"></div>
      </section>
      <section class="panel landport" id="p-lp"></section>
    </div>

    <div class="side-column side-column--right">
      <section class="panel platform" id="p-ap"></section>
      <section class="panel landport-side" id="lp-vehicles"></section>
    </div>
  </main>

  <div class="foot"><span>静态数据由综合一处、综合二处按月维护，非实时更新；动态数据来自三大现场平台接口。</span><span>当前为演示数据，仅用于界面展示</span></div>
</div>

<div class="ov" id="ov" hidden><div class="md" id="md"><div class="md-h"><h3 id="ov-title"></h3><button id="ov-x" title="关闭">×</button></div><div class="md-b" id="ov-body"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
window.THEME = {
  id:'overview',
  CL:['#27D3F5','#F2B33D','#FF5A7A','#4DD98B','#8D7BFF'],
  sep:'#062A63',hole:0.52,fill:false,areaOp:[0.4,0.05],labels:true,barGrad:true,area:false,
  sceneBg:'#052252',road:'#0E4A99',switch:[]
};
</script>
<script src="v3-assets/dash-core.js"></script>
<script>
const dashboardRoot=document.querySelector('.dashboard');
const landportRoot=document.querySelector('#p-lp');
const verticalModuleTitles=new Set(['船舶靠港情况','进出口标志','业务占比','今日提示']);
const sideLegendTitles=new Set(['船舶靠港情况','进出口标志','业务占比','今日提示']);
function createPieSideLayout(svg,moduleTitle,yoyByName={}){
  if(!svg)return null;
  const paths=Array.from(svg.querySelectorAll('path'));
  const entries=Array.from(svg.querySelectorAll('text')).map((node,index)=>{
    const parts=Array.from(node.querySelectorAll('tspan'),span=>span.textContent.trim()).filter(Boolean);
    const tip=paths[index]?.querySelector('title')?.textContent||'';
    const match=/^(.+?)：([\d,.]+)([^（）]*)（([\d.]+%)）$/.exec(tip);
    const isShare=moduleTitle==='业务占比';
    let value=match?.[2]||parts[1]||'';
    let unit=match?.[3]?.trim()||'';
    if(isShare&&match){value=(Number(match[2].replace(/,/g,''))/10000).toFixed(2);unit='万票'}
    if(moduleTitle==='税收入库'&&!unit)unit='亿元';
    const share=match?.[4]||parts[2]||'';
    const yoy=yoyByName[match?.[1]||parts[0]]||'';
    return {label:match?.[1]||parts[0],value,unit,share,yoy,color:paths[index]?.getAttribute('fill')};
  }).filter(entry=>entry.label&&entry.value);
  if(!entries.length)return null;

  const layout=document.createElement('div');layout.className='pie-side-layout';
  const visual=document.createElement('div');visual.className='pie-side-visual';
  const details=document.createElement('div');details.className='pie-side-details';details.setAttribute('role','list');
  svg.setAttribute('viewBox','86 28 128 124');
  svg.setAttribute('role','img');svg.setAttribute('aria-label',moduleTitle+'分布');
  visual.append(svg);
  entries.forEach(entry=>{
    const row=document.createElement('div');row.className='pie-side-row';row.setAttribute('role','listitem');
    const mark=document.createElement('span');mark.className='pie-side-mark';mark.style.background=entry.color||'var(--acc)';
    const label=document.createElement('span');label.className='pie-side-label';label.textContent=entry.label;
    const value=document.createElement('b');value.textContent=entry.value;
    if(entry.unit){const unit=document.createElement('span');unit.className='side-unit';unit.textContent=entry.unit;value.append(unit)}
    const notes=[];
    if(entry.share)notes.push('占比 '+entry.share);
    if(entry.yoy)notes.push('同比 '+entry.yoy);
    const note=document.createElement('small');note.textContent=notes.join(' · ');
    row.append(mark,label,value,note);details.append(row);
  });
  layout.append(visual,details);
  return layout;
}
function collectYoyByName(container,rows){
  const values={};
  rows.forEach(row=>{
    const label=row.label;
    const yoy=row.node.querySelector('.yb')?.textContent.trim();
    if(label&&yoy)values[label]=yoy;
  });
  return values;
}
function decorateStaticPieCards(){
  const cards=document.querySelectorAll('#static>.card');
  const imports=cards[0];
  const tax=cards[1],emerging=cards[3];
  if(imports&&!imports.dataset.importLegendMoved){
    const heading=imports.querySelector('.ch'),legend=imports.querySelector('.cbody>.legend');
    if(heading&&legend){
      heading.querySelector('i')?.remove();
      heading.append(legend);
      imports.classList.add('import-export-card');
      imports.dataset.importLegendMoved='true';
    }
  }
  if(tax&&!tax.dataset.sidePieDecorated){
    const body=tax.querySelector('.cbody'),kpis=body?.querySelector('.kpis'),svg=body?.querySelector('.pie');
    const legend=body?.querySelector('.legend');
    const rows=Array.from(legend?.children||[]).map(node=>({
      node,label:Array.from(node.childNodes).filter(child=>child.nodeType===Node.TEXT_NODE).map(child=>child.textContent).join('').trim()
    }));
    const layout=createPieSideLayout(svg,'税收入库',collectYoyByName(body,rows));
    if(body&&kpis&&layout){tax.classList.add('static-pie-card','tax-pie-card');body.replaceChildren(kpis,layout);tax.dataset.sidePieDecorated='true'}
  }
  if(emerging&&!emerging.dataset.sidePieDecorated){
    const body=emerging.querySelector('.cbody'),svg=body?.querySelector('.pie'),list=body?.children[1];
    const rows=Array.from(list?.children||[]).map(node=>({
      node,label:Array.from(node.childNodes).find(child=>child.nodeType===Node.TEXT_NODE)?.textContent.trim()
    }));
    const layout=createPieSideLayout(svg,'新兴业态',collectYoyByName(body,rows));
    if(body&&layout){emerging.classList.add('static-pie-card','emerging-pie-card');body.replaceChildren(layout);emerging.dataset.sidePieDecorated='true'}
  }
}
document.querySelectorAll('.sub').forEach(section=>{
  const title=section.firstElementChild;
  const moduleTitle=title?.textContent.trim();
  if(!title||title.tagName!=='H4'||!verticalModuleTitles.has(moduleTitle))return;
  if(moduleTitle==='业务占比')title.textContent='业务占比（票数：万）';
  section.classList.add('vertical-module');
  const content=document.createElement('div');
  content.className='sub-content';
  while(title.nextElementSibling)content.append(title.nextElementSibling);
  section.append(content);
  if(!sideLegendTitles.has(moduleTitle))return;
  const svg=content.querySelector('.pie');
  if(!svg)return;
  const layout=createPieSideLayout(svg,moduleTitle);
  if(layout)content.replaceChildren(layout);
});
const landportBody=landportRoot?.querySelector('.pb');
if(dashboardRoot&&landportRoot&&landportBody){
  const sections=Array.from(landportBody.children);
  const frequent=sections[3],vehicles=sections[4];
  const frequentTarget=document.querySelector('#lp-frequent');
  const vehiclesTarget=document.querySelector('#lp-vehicles');
  if(frequent&&vehicles&&frequentTarget&&vehiclesTarget){
    for(const child of Array.from(frequent.childNodes))frequentTarget.append(child);
    for(const child of Array.from(vehicles.childNodes))vehiclesTarget.append(child);
    frequent.remove();
    vehicles.remove();
  }
}
const staticRoot=document.querySelector('#static');
decorateStaticPieCards();
new MutationObserver(decorateStaticPieCards).observe(staticRoot,{childList:true});
</script>
</body>
</html>
