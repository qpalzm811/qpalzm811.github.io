 return `<section class="d-panel panel ${cls}"><div class="panel-heading"><h3>${ESC(title)}</h3>${tag?`<span class="panel-tag">${ESC(tag)}</span>`:''}</div><div class="panel-body">${body}</div><button class="panel-link" data-title="${ESC(title)}" data-desc="${ESC(desc||'查看'+title+'的专题内容与明细。')}" aria-label="查看${ESC(title)}的区域说明"><span>查看区域说明</span></button></section>`;
}
function legend(labels){return `<div class="legend">${labels.map((x,i)=>`<span><i style="--c:${palette[i%palette.length]}"></i>${ESC(x)}</span>`).join('')}</div>`}

function table(headers,rows=4,tiny=false){return `<div class="table-wrap ${tiny?'tiny':''}"><table class="dash-table"><thead><tr>${headers.map(t=>`<th>${ESC(t)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:rows},()=>`<tr>${headers.map(()=>'<td>—</td>').join('')}</tr>`).join('')}</tbody></table></div>`}
function summary(items){return `<div class="summary-lines">${items.map(t=>`<div><i></i><span>${ESC(t)}</span><b>—</b></div>`).join('')}</div>`}
function chips(items){return `<div class="label-chips">${items.map(t=>`<span>${ESC(t)}</span>`).join('')}</div>`}
function sixMonitor(){return `<div class="monitor-six">${['在库数','当日过机数','累计过机数','15天未过机','待查验','查验异常'].map((t,i)=>`<div class="submetric ${i>2?'gold':''}"><span class="sub-label">${t}</span><strong>—</strong></div>`).join('')}</div>`}

function handleSchemeNavClick(e){
 const source=e.target.closest('[data-warning-group]');
 if(source){showWarningExplanation(Number(source.dataset.warningGroup),source);return}
 if(e.target.closest('#alertDemoBtn')){alertDemoEnabled=!alertDemoEnabled;select(activeIndex);$('alertDemoBtn').focus();return}
 const b=e.target.closest('.scheme-button[data-id]');if(b)select(screens.findIndex(s=>s.id===b.dataset.id));

function showWarningExplanation(group,trigger){
 const w=warningExamples[group];if(!w)return;
 lastFocus=trigger;
 $('drawerTitle').textContent=w.name+' · 演示提醒';
 $('drawerText').textContent=w.title+'。红点只表示本设计稿中的待关注提示，不代表真实预警。';
 $('drawerDetails').innerHTML=w.items.map(t=>`<li>${ESC(t)}</li>`).join('');
 $('drawerAction').hidden=false;$('drawerAction').dataset.cockpit=w.target;
 $('drawerShade').hidden=false;$('drawerClose').focus();
}
function refreshNavigationAlerts(){
 document.querySelectorAll('#canvasArea .cockpit-tab[data-cockpit]').forEach(b=>{

   if(s&&hasDemoWarning(s.group)){
    b.insertAdjacentHTML('beforeend',warningDot());
    b.title=warningExamples[s.group].title+'（演示）';
    b.setAttribute('aria-label',b.textContent.trim()+'，有待关注事项（演示）');
   }

 $('currentNumber').textContent=String(activeIndex+1).padStart(2,'0');
 $('totalNumber').textContent=String(screens.length).padStart(2,'0');
 document.querySelectorAll('.scheme-button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===s.id)));
 const peers=screens.filter(p=>p.group===s.group);const paired=compare&&peers.length>=2;
 const alternate=peers.find(p=>p.id===compareReference&&p.id!==s.id)||peers.find(p=>p.id!==s.id);
 $('variantTabs').innerHTML=peers.map(p=>`<button class="variant" data-id="${p.id}" aria-pressed="${s.id===p.id}">${p.variant?'方案 '+p.variant+' · ':''}${ESC(p.name)}</button>`).join('')+(paired&&peers.length>2?`<label class="compare-picker">对比参考<select id="compareTarget" aria-label="选择对比参考方案">${peers.filter(p=>p.id!==s.id).map(p=>`<option value="${p.id}" ${p.id===alternate.id?'selected':''}>${p.variant} · ${ESC(p.name)}</option>`).join('')}</select></label>`:'');
 $('canvasArea').className=paired?'comparison':'';
 $('canvasArea').innerHTML=paired?[s,alternate].map(p=>`<div><div class="compare-label">方案 ${p.variant} / ${ESC(p.name)}</div>${frame(p)}</div>`).join(''):frame(s);
 $('compareBtn').disabled=peers.length<2;$('compareBtn').setAttribute('aria-pressed',String(paired));$('compareBtn').textContent=paired?'退出对比':'并排对比';
 $('notes').innerHTML=[['布局重点',s.focus],['方案差异',s.difference],['视觉口径',s.id==='P01-C'?'关注重点属于设计建议，红点属于演示；预警规则与重点指标尚未确认。':'深蓝驾驶舱风格；业务模块完整命名，数值以横线占位。']].map(([a,b])=>`<div><div class="note-label">${a}</div><p class="note-content">${ESC(b)}</p></div>`).join('');
 refreshNavigationAlerts();history.replaceState(null,'','#'+s.id);requestAnimationFrame(fit);
}
document.addEventListener('change',e=>{if(e.target.id==='compareTarget'){compareReference=e.target.value;select(activeIndex)}});
document.addEventListener('click',e=>{
 if(e.target.closest('#canvasArea .panel-link'))$('drawerAction').hidden=true;
 if(e.target.closest('#drawerAction'))closeDrawer();
});

let activeIndex=0,compare=false,lastFocus=null,wasCompare=false;
const $=id=>document.getElementById(id);
function initNav(){renderSchemeNav();$('schemeNav').addEventListener('click',handleSchemeNavClick)}
function frame(s){return `<div class="screen-wrap"><div class="screen-viewport">${makeScreen(s)}</div></div>`}
function fit(){document.querySelectorAll('#canvasArea .screen-viewport').forEach(v=>{const scale=v.clientWidth/1600;v.style.height=(900*scale)+'px';v.querySelector('.screen').style.transform=`scale(${scale})`})}
function select(i){selectSchemeIndex(i)}
$('variantTabs').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)select(screens.findIndex(s=>s.id===b.dataset.id))});
$('compareBtn').onclick=()=>{compare=!compare;select(activeIndex)};
function setPresentation(on){document.body.classList.toggle('presenting',on);if(on){wasCompare=compare;compare=false}else compare=wasCompare;select(activeIndex)}
$('presentBtn').onclick=()=>setPresentation(true);$('exitPresentation').onclick=()=>setPresentation(false);
$('canvasArea').addEventListener('click',e=>{const b=e.target.closest('.panel-link');if(!b)return;lastFocus=b;const title=b.dataset.title;const n=notesByTitle[title];$('drawerTitle').textContent=title;$('drawerText').textContent=n?n[0]:b.dataset.desc;$('drawerDetails').innerHTML=(n?n.slice(1):['二级页面承接该业务的完整专题内容','三级页面查看具体记录或指标明细']).map(x=>`<li>${ESC(x)}</li>`).join('');$('drawerShade').hidden=false;$('drawerClose').focus()});
function closeDrawer(){$('drawerShade').hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
$('drawerClose').onclick=closeDrawer;$('drawerShade').addEventListener('click',e=>{if(e.target===$('drawerShade'))closeDrawer()});
document.addEventListener('keydown',e=>{if(!$('drawerShade').hidden){if(e.key==='Escape')closeDrawer();if(e.key==='Tab'){e.preventDefault();const a=$('drawerAction');if(!a.hidden&&document.activeElement===$('drawerClose'))a.focus();else $('drawerClose').focus()}return}if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();select(activeIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();select(activeIndex-1)}if(e.key==='Escape'&&document.body.classList.contains('presenting'))setPresentation(false)});
function buildPrint(){$('printPages').innerHTML=screens.map(s=>`<section class="print-sheet"><h2 class="print-title">${s.id} / ${ESC(groups[s.group])} / ${ESC(s.name)}</h2><p class="print-description">${ESC(s.desc)}</p><div class="print-frame">${makeScreen(s)}</div><div class="print-foot">布局重点：${ESC(s.focus)}　｜　层级：${s.level.map(ESC).join(' → ')}</div></section>`).join('')}
$('printBtn').onclick=()=>{buildPrint();window.print()};window.addEventListener('beforeprint',buildPrint);window.addEventListener('resize',fit);new ResizeObserver(fit).observe($('canvasArea'));initNav();let initial=screens.findIndex(s=>s.id===location.hash.slice(1));select(initial<0?screens.findIndex(s=>s.id==='P01-C'):initial);
</script>
</body>
</html>
